name: Playwright Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout practice website
        uses: actions/checkout@v6
        with:
          repository: sanjeebbanjara01-cpu/playwright-practice-website
          path: test-app

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Run Playwright tests
        env:
          BASE_URL: http://127.0.0.1:4173/
          AUTH_ENABLED: ${{ vars.AUTH_ENABLED || 'false' }}
          USERNAME: ${{ secrets.TEST_USERNAME }}
          PASSWORD: ${{ secrets.TEST_PASSWORD }}
          LOGIN_PATH: ${{ vars.LOGIN_PATH || 'login.html' }}
          AUTHENTICATED_PATH: ${{ vars.AUTHENTICATED_PATH || 'dashboard.html' }}
          USERNAME_SELECTOR: ${{ vars.USERNAME_SELECTOR || 'input[name="email"]' }}
          PASSWORD_SELECTOR: ${{ vars.PASSWORD_SELECTOR || 'input[name="password"]' }}
          SUBMIT_SELECTOR: ${{ vars.SUBMIT_SELECTOR || 'button[type="submit"]' }}
        run: npm test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-reports
          retention-days: 14
          path: |
            playwright-report/
            test-results/
